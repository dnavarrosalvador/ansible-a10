---
# ============================================================================
#  a10_interface_cli.yml   (variante CLI · a10.acos_cli)
#
#  Configura por CLI (SSH) la interfaz de datos del A10 hacia los servers
#  (subredes 172.22.35.0/24 y 38.0/24). Debe ejecutarse ANTES del balanceo (ver site_cli.yml).
# ============================================================================

- name: "A10 (CLI) | Interfaz de datos hacia los servers "
  hosts: vthunder
  gather_facts: false
  # become: true
  # La conexión network_cli y el modo enable se definen en group_vars/vthunder.yml

  tasks:

    - name: "Configurar y habilitar las interfaces ethernet (ACOS CLI)"
      # Usamos acos_command (no acos_config): con varias interfaces, el
      # NetworkConfig de acos_config deduplica las líneas 'enable'/'exit'
      # repetidas y la segunda interfaz quedaría a medias. Aquí se envían
      # los comandos tal cual y en orden, como en la sesión CLI interactiva.
      a10.acos_cli.acos_command:
        commands: >-
          {{ ['configure']
             + (lookup('template', 'templates/interface_cli.j2').splitlines() | select() | list)
             + (['end', 'write memory'] if (save_config | bool) else ['end']) }}
      register: intf_out
